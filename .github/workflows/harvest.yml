name: harvest

# Hourly harvest of what the stations are playing.
# A public repo means unlimited minutes, so the whole "backend" is free.
on:
  schedule:
    - cron: "17 * * * *"   # off the hour — that is when GitHub is busiest
  workflow_dispatch:        # manual run

concurrency:
  group: harvest
  cancel-in-progress: false   # never interrupt a run mid index write

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest
        run: python harvest.py --catalog dist/catalog.json --data data --out dist

      - name: Commit the index
        run: |
          git config user.name  "blare-harvester"
          git config user.email "harvester@users.noreply.github.com"
          # simulcast.json is only produced when harvest runs with --simulcast,
          # which CI does not. Adding a missing path would fail the job.
          git add data/plays.json dist/artist_index.json
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "harvest: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have pushed meanwhile — rebase instead of failing.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
