name: rebuild-catalog

# The catalog changes slowly — weekly is enough. Rebuilds it and re-checks
# which stations are watchable.
on:
  schedule:
    - cron: "40 3 * * 1"   # early Monday morning
  workflow_dispatch:

concurrency:
  group: harvest          # must not run at the same time as the harvest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the catalog
        run: |
          python build.py --countries SK,CZ,DE,GB,US,PL,AT,HU,FR,IT,ES,NL \
            --tags rock,jazz,metal,electronic,classical \
            --limit 800 --out dist --watchable
      - name: Commit
        run: |
          git config user.name  "blare-harvester"
          git config user.email "harvester@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "catalog: $(date -u +%F)"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
