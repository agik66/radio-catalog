name: rebuild-catalog

# Katalóg sa mení pomaly — týždenne stačí. Prestavia ho a znovu zistí,
# ktoré stanice sú sledovateľné.
on:
  schedule:
    - cron: "40 3 * * 1"   # pondelok nadránom
  workflow_dispatch:

concurrency:
  group: harvest          # nesmie bežať súčasne so zberom
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prestavba katalógu
        run: |
          python build.py --countries SK,CZ,DE,GB,US,PL,AT,HU,FR,IT,ES,NL \
            --tags rock,jazz,metal,electronic,classical \
            --limit 800 --out dist --watchable
      - name: Commit
        run: |
          git config user.name  "cliamp-harvester"
          git config user.email "harvester@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "catalog: $(date -u +%F)"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
