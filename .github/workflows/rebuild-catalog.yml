name: rebuild-catalog

# The catalog changes slowly — weekly is enough. Rebuilds it and re-checks
# which stations are watchable.
on:
  schedule:
    - cron: "40 3 * * 1"   # early Monday morning
  workflow_dispatch:

concurrency:
  group: harvest          # must not run at the same time as the harvest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deep in the big listening markets, then one head from every other
      # country on earth — see the two-pass comment in build.py. The old
      # twelve-country list made a catalog that was half Czech and Slovak.
      - name: Rebuild the catalog
        run: |
          python build.py \
            --countries US,GB,DE,FR,IT,ES,NL,SE,NO,DK,FI,PL,CZ,SK,AT,CH,HU,RO,GR,PT,IE,BE,CA,AU,NZ,JP,KR,BR,AR,MX,ZA,IN,UA,TR,IL \
            --tags rock,jazz,metal,electronic,classical,ambient,hiphop,soul,reggae,blues,funk,indie,punk,folk,latin \
            --worldwide 25 \
            --limit 300 --out dist --watchable
      - name: Commit
        run: |
          git config user.name  "blare-harvester"
          git config user.email "harvester@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "catalog: $(date -u +%F)"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
